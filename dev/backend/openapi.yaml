      summary: Reject task submission
      description: Requires task:review permission and keeps audit trace. Platform submissions must use reconcile instead.
      security:
        - AdminBearerAuth: []
      parameters:
        - name: submissionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Submission rejected
        "409":
          description: Platform submission requires trusted provider reconciliation
        "403":
          description: Missing task review permission

  /api/admin/task-submissions/{submissionId}/reconcile:
    post:
      tags: [Admin]
      summary: Associate a platform review order and reconcile its trusted result
      description: Requires task:review permission and an operator verification reason. Searches at most 20 provider pages and verifies the user and task. Existing conflicting associations cannot be overwritten. Pending reviews remain pending; terminal reviews use the original reward snapshot and idempotent ledger rules. Client reward amounts and review statuses are not accepted.
      security:
        - AdminBearerAuth: []
      parameters:
        - name: submissionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [externalOrderId, reason]
              properties:
                externalOrderId:
                  type: string
                  minLength: 1
                reason:
                  type: string
                  minLength: 1
      responses:
        "200":
          description: Association persisted and provider result reconciled; a pending provider review does not grant points
        "400":
          description: Missing order ID or reason, or submission is not a platform submission
        "403":
          description: Missing task review permission
        "404":
          description: Local submission not found
        "409":
          description: Provider order not found within search limit, identity mismatch, conflicting association or reward state
        "502":
          description: Invalid provider review list or status
        "503":
          description: Task platform not configured

