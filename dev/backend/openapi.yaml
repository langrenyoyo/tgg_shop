  /api/admin/withdrawals/{withdrawalId}/approve:
    post:
      tags: [Admin]
      summary: Deprecated direct withdrawal approval
      description: Requires withdraw:approve permission, but sensitive withdrawal payout must be submitted through /api/admin/approval-requests with action withdrawal.approve.
      security:
        - AdminBearerAuth: []
      parameters:
        - name: withdrawalId
          in: path
