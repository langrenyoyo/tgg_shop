            type: string
      responses:
        "200":
          description: Deprecated compatibility response
        "409":
          description: Secondary approval required
        "403":
          description: Missing withdrawal approval permission

  /api/admin/withdrawals/{withdrawalId}/reject:
    post:
      tags: [Admin]
      summary: Deprecated direct withdrawal rejection
      description: Requires withdraw:approve permission, but sensitive withdrawal rejection must be submitted through /api/admin/approval-requests with action withdrawal.reject.
      security:
        - AdminBearerAuth: []
      parameters:
        - name: withdrawalId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deprecated compatibility response
        "409":
          description: Secondary approval required
        "403":
          description: Missing withdrawal approval permission

  /api/admin/withdrawals/{withdrawalId}/submit-provider:
    post:
      tags: [Admin]
      summary: Submit an approved withdrawal to the configured provider
      description: Requires withdraw:approve permission. The withdrawal must already be approved by secondary review. Provider submission moves it to processing; it does not create a payout ledger entry. Success is recorded only after a trusted provider callback or query.
      security:
        - AdminBearerAuth: []
      parameters:
        - name: withdrawalId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Provider submission accepted; await callback/query }
        "400": { description: Withdrawal is not approved or cannot be submitted }
        "502": { description: Provider submission failed }
        "503": { description: Provider is not configured }
        "403": { description: Missing withdrawal approval permission }

  /api/admin/order-status-logs:
    get:
      tags: [Admin]
      summary: List order status change logs
      security:
        - AdminBearerAuth: []
      responses:
        "200":
          description: Order status logs
        "403":
