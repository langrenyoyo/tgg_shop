  /api/admin/operation-logs:
    get:
      tags: [Admin]
      summary: List admin operation logs
      security:
        - AdminBearerAuth: []
      responses:
        "200":
          description: Operation logs
        "403":
          description: Missing role read permission

  /api/admin/approval-requests:
    get:
      tags: [Admin]
      summary: List secondary approval requests
      description: Requires approval:request permission. Finance can submit sensitive refund, withdrawal, and manual points adjustment actions into this queue before final execution.
      security:
        - AdminBearerAuth: []
      responses:
        "200":
          description: Approval request list
        "403":
          description: Missing approval request permission
    post:
      tags: [Admin]
      summary: Submit a sensitive operation for secondary approval
      description: Requires approval:request permission. Supported actions include refund.approve, withdrawal.approve, withdrawal.reject, and points.adjust. An explicit idempotencyKey replays the original request even after execution; changed action, target, reason, requester role or point amount returns 409. A distinct key cannot silently attach to a pending request. Clients should retain the same key and intent after uncertain network results.
      security:
        - AdminBearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [action, targetType, targetId, reason]
              properties:
                idempotencyKey:
                  type: string
                  minLength: 1
                  maxLength: 128
                action:
                  type: string
                  enum: [refund.approve, withdrawal.approve, withdrawal.reject, points.adjust]
                targetType:
                  type: string
                  enum: [refund, withdrawal, user]
                targetId:
                  type: string
                payload:
                  type: object
                  properties:
                    pointsDelta:
                      type: integer
                      minimum: -9007199254740991
                      maximum: 9007199254740991
                      description: Nonzero safe integer. Fractional adjustments are rejected, never truncated. Execution revalidates the current balance.
                reason:
                  type: string
      responses:
        "201":
          description: Approval request submitted
        "400":
          description: Invalid approval request
        "409":
          description: Conflicting pending point adjustment, invalid balance, insufficient points or unsafe resulting balance
        "403":
          description: Missing approval request permission

  /api/admin/approval-requests/{approvalId}/approve:
    post:
      tags: [Admin]
      summary: Review and execute a secondary approval request
      description: Requires approval:review permission. Executes the original refund or withdrawal operation after review.
      security:
        - AdminBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ApprovalId"
      responses:
        "200":
          description: Approval executed
        "400":
          description: Approval cannot be executed
        "403":
          description: Missing approval review permission
        "404":
          description: Approval request not found

  /api/admin/approval-requests/{approvalId}/reject:
    post:
      tags: [Admin]
      summary: Reject a secondary approval request
      description: Requires approval:review permission. Rejecting the approval leaves the target refund or withdrawal pending for follow-up.
      security:
        - AdminBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ApprovalId"
      responses:
        "200":
          description: Approval rejected
        "400":
          description: Approval cannot be rejected
        "403":
          description: Missing approval review permission
        "404":
          description: Approval request not found

  /api/admin/ledger:
    get:
      tags: [Admin]
      summary: List point and payment ledgers
      description: Requires ledger:read. Includes pointReconciliation for all stored point history regardless of payment filters. This read-only report detects malformed entries, duplicate identities, broken balance chains and mismatched current balances. It does not verify the opening balance or repair accounts. Missing history or equal posting timestamps can leave a user unverified.
      security:
        - AdminBearerAuth: []
      parameters:
        - name: paymentStatus
          in: query
          schema:
            type: string
            enum: [pending, paid, failed, refunded, cancelled]
        - name: payScene
          in: query
          schema:
            type: string
            enum: [goods_cash, member_open, cash_diff]
        - name: channel
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Ledgers plus pointReconciliation with scope=stored_history, openingBalanceVerified=false, summary counts and per-user rows (userId, actualBalance, expectedBalance, entryCount, status consistent/mismatch/unverified, issues). Expected balance is null when no unique valid latest entry exists.
        "403":
          description: Missing ledger read permission

  /api/admin/payments/cancel-timeouts:
    post:
      tags: [Admin]
      summary: Cancel timed-out pending payment orders
      description: Requires exception:write permission. Pending payment_order rows older than timeoutMinutes are marked cancelled and entered into exception compensation with payment_timeout_cancelled.
      security:
        - AdminBearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                timeoutMinutes:
                  type: integer
                  minimum: 1
                now:
                  type: string
                  format: date-time
      responses:
        "200":
          description: Timeout scan completed
        "403":
          description: Missing exception write permission

  /api/admin/delivery/scan-exceptions:
    post:
      tags: [Admin]
      summary: Scan self-built delivery exceptions
      description: Requires delivery:dispatch permission. Shipping orders older than timeoutMinutes are entered into exception compensation with delivery_timeout and linked customer tickets.
      security:
        - AdminBearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                timeoutMinutes:
                  type: integer
                  minimum: 1
                now:
                  type: string
                  format: date-time
      responses:
        "200":
          description: Delivery exception scan completed
        "403":
          description: Missing delivery dispatch permission

  /api/admin/permissions:
    get:
      tags: [Admin]
      summary: List admin roles and permissions
      security:
        - AdminBearerAuth: []
      responses:
        "200":
          description: Role list
        "403":
          description: Missing role read permission

  /api/admin/exceptions:
    get:
      tags: [Admin]
      summary: List exception compensation queue
      security:
        - AdminBearerAuth: []
      responses:
        "200":
          description: Exceptions
        "403":
          description: Missing exception read permission
    post:
      tags: [Admin]
      summary: Create exception compensation record
      description: Requires exception:write permission.
      security:
        - AdminBearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [type, bizNo, action]
              properties:
                type:
                  type: string
                bizNo:
                  type: string
                action:
                  type: string
                payload:
                  type: object
      responses:
        "201":
          description: Exception created
        "403":
          description: Missing exception write permission

  /api/admin/exceptions/{exceptionId}/resolve:
    post:
      tags: [Admin]
      summary: Mark exception compensation as resolved
      description: Requires exception:write permission.
      security:
        - AdminBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ExceptionId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
      responses:
        "200":
          description: Exception resolved
        "400":
          description: Exception already resolved
        "403":
          description: Missing exception write permission
        "404":
          description: Exception not found

  /api/admin/refunds:
    get:
      tags: [Admin]
      summary: List refund requests
      security:
        - AdminBearerAuth: []
      responses:
        "200":
          description: Refund request list
        "403":
          description: Missing refund approval permission

  /api/admin/refunds/{refundId}/approve:
    post:
      tags: [Admin]
      summary: Deprecated direct refund approval
      description: Sensitive refund approval must be submitted through /api/admin/approval-requests with action refund.approve.
      security:
        - AdminBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RefundId"
      responses:
        "200":
          description: Deprecated compatibility response
        "400":
          description: Refund cannot be approved
        "409":
          description: Secondary approval required
        "403":
          description: Missing refund approval permission

components:
  securitySchemes:
    UserBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: HMAC
    AdminBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: HMAC
  parameters:
    ProductId:
      in: path
      name: productId
      required: true
      schema:
        type: string
    OrderId:
      in: path
      name: orderId
      required: true
      schema:
        type: string
    TaskId:
      in: path
      name: taskId
      required: true
      schema:
        type: string
    RefundId:
      in: path
      name: refundId
      required: true
      schema:
        type: string
    ApprovalId:
      in: path
      name: approvalId
      required: true
      schema:
        type: string
    ExceptionId:
      in: path
      name: exceptionId
      required: true
      schema:
        type: string
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        nickname:
          type: string
        role:
          type: string
          enum: [normal, member]
        isMember:
          type: boolean
        points:
          type: integer
    CreateOrderRequest:
      type: object
      required: [paymentMode, fulfillmentType, items]
      properties:
        idempotencyKey:
          type: string
          description: Persist across retries of the same checkout attempt to recover the original order.
        paymentMode:
          type: string
          enum: [cash, pure_points, points_plus_cash]
        fulfillmentType:
          type: string
          enum: [pickup, delivery]
        pickupSiteId:
          type: string
        deliveryAddress:
          type: string
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [productId, quantity]
            properties:
              productId:
                type: string
              quantity:
                type: integer
                minimum: 1
