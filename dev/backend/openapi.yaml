openapi: 3.0.3
info:
  title: TGG Shop Dev API
  version: 0.1.0
  description: Development API contract for the TGG Shop MVP backend.
servers:
  - url: http://localhost:5177
security:
  - UserBearerAuth: []
tags:
  - name: Health
  - name: Uploads
  - name: Auth
  - name: Catalog
  - name: Orders
  - name: Payments
  - name: Tasks
  - name: Growth
  - name: Admin
paths:
  /api/health:
    get:
      tags: [Health]
      summary: Health check
      security: []
      responses:
        "200":
          description: Service is available

  /api/common/upload:
    post:
      tags: [Uploads]
      summary: Upload task evidence image
      description: Requires an authenticated user. Multipart request body is limited to 10 MiB. Returned relative upload paths must be resolved against the API origin before submission to external platforms.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "401":
          description: Login required
        "413":
          description: Multipart body exceeds 10 MiB
        "200":
          description: Upload result
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  msg:
                    type: string
                    example: 上传成功
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        url:
                          type: string
                        path:
                          type: string

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get current user by Bearer token
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /api/auth/login:
    post:
      tags: [Auth]
      summary: User login and token issue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: string
                  example: u_1001
                password:
                  type: string
                  example: "123456"
      responses:
        "200":
          description: Logged-in user with Bearer token
        "401":
          description: Invalid credentials
        "404":
          description: User not found

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke current user token session
      responses:
        "200":
          description: User session revoked
        "401":
          description: Missing or invalid token

  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh current user access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: New user access and refresh token pair
        "401":
          description: Refresh token invalid or expired

  /api/admin/auth/login:
    post:
      tags: [Admin]
      summary: Admin login and token issue
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleId, password]
              properties:
                roleId:
                  type: string
                  example: super_admin
                password:
                  type: string
                  example: "123456"
      responses:
        "200":
          description: Logged-in admin role with Bearer token
        "401":
          description: Invalid credentials

  /api/admin/auth/logout:
    post:
      tags: [Admin]
      summary: Revoke current admin token session
      security:
        - AdminBearerAuth: []
      responses:
        "200":
          description: Admin session revoked
        "401":
          description: Missing or invalid token

  /api/admin/auth/refresh:
    post:
      tags: [Admin]
      summary: Refresh current admin access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: New admin access and refresh token pair
        "401":
          description: Refresh token invalid or expired

  /api/me:
    get:
      tags: [Auth]
      summary: Alias of current user endpoint
      responses:
        "200":
          description: Current user

  /api/config:
    get:
      tags: [Catalog]
      summary: Get runtime configuration
      responses:
        "200":
          description: Config map

  /api/home:
    get:
      tags: [Catalog]
      summary: Get home page data
      responses:
        "200":
          description: Home payload

  /api/products:
    get:
      tags: [Catalog]
      summary: List active products
      parameters:
        - in: query
          name: category
          schema:
            type: string
      responses:
        "200":
          description: Product list

  /api/products/{productId}:
    get:
      tags: [Catalog]
      summary: Get product detail
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Product detail
        "404":
          description: Product not found

  /api/points-exchange:
    get:
      tags: [Catalog]
      summary: List pure-points exchange products
      responses:
        "200":
          description: Pure-points products

  /api/auth/wechat-login:
    post:
      tags: [Auth]
      summary: Exchange WeChat login code for an application session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                inviteCode:
                  type: string
                  description: Optional invitation code bound on first registration.
      responses:
        "200":
          description: Application token, refreshToken and user; new registrations receive configured trial membership.
        "400":
          description: Missing or invalid code

  /api/member/payments:
    post:
      tags: [Payments]
      summary: Create or recover the current user's pending membership payment
      description: Does not activate membership. The mini-program initiates LFWin payment and queries the server for confirmation. An existing pending payment is reused; a different requested duration conflicts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                months:
                  type: integer
                  minimum: 1
                  maximum: 12
                  default: 1
                idempotencyKey:
                  type: string
      responses:
        "201":
          description: Payment ledger object including payNo, amount, status and metadata
        "400":
          description: Invalid membership duration
        "409":
          description: Idempotency key or pending membership duration conflict

  /api/orders/{orderId}:
    get:
      tags: [Orders]
      summary: Get own order with refund records and status history
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order object with refunds and history arrays
        "404":
          description: Order does not exist or belongs to another user

  /api/orders/{orderId}/cancel:
    post:
      tags: [Orders]
      summary: Cancel own unpaid order and release stock and reserved points once
      description: Provider orders must close remotely first. Unknown provider submission results must be queried before cancellation. Repeated successful cancellation returns the original order.
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cancelled order
        "404":
          description: Order does not exist or belongs to another user
        "409":
          description: Order state or unresolved payment prevents cancellation
        "502":
          description: Provider close request failed

  /api/orders/{orderId}/receive:
    post:
      tags: [Orders]
      summary: Confirm receipt of own delivery order
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Completed order; repeated confirmation is idempotent
        "400":
          description: Order is not eligible for delivery receipt
        "404":
          description: Order does not exist or belongs to another user

  /api/refunds/{refundId}:
    get:
      tags: [Orders]
      summary: Get own refund request and related order state
      description: A refund request is not proof that money has been returned. Production cash refund execution is currently unavailable.
      parameters:
        - name: refundId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Refund object with related order id, status and fulfillmentStatus
        "404":
          description: Refund does not exist or belongs to another user

  /api/member/subscribe:
    post:
      tags: [Payments]
      summary: Open or extend monthly membership
      description: Creates a member_open payment_order and mock-confirms it in development unless autoPay is false.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                months:
                  type: integer
                  minimum: 1
                  default: 1
                channel:
                  type: string
                  enum: [mock_pay, wechat, alipay]
                  default: mock_pay
                autoPay:
                  type: boolean
                  default: true
      responses:
        "200":
          description: Updated user

  /api/orders:
    get:
      tags: [Orders]
      summary: List current user orders
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending_payment, paid, completed, cancelled, closed, refunding, refunded]
        - name: fulfillmentStatus
          in: query
          schema:
            type: string
            enum: [pending_pickup, picked_up, pending_ship, shipping, delivered]
        - name: page
          in: query
          description: Optional pagination; omitted preserves the legacy array of all matching orders. Paged results sort newest first.
          schema:
            type: integer
            minimum: 1
        - name: count
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Order list
        "400":
          description: Invalid filter or pagination
    post:
      tags: [Orders]
      summary: Create order
      description: Pure-points orders are paid immediately and never create cash top-up. Reuse the same idempotency key only with the original items, payment and fulfillment choices. Conflicting content returns 409; identical retries return the original order without another deduction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Created order
        "400":
          description: Business rule violation
        "409":
          description: Idempotency key already used for different order content

  /api/orders/{orderId}/pay:
    post:
      tags: [Payments]
      summary: Create and mock-confirm a pending cash payment
      description: Backward-compatible shortcut. Internally creates a payment_order with pay_scene goods_cash or cash_diff, then handles an idempotent mock callback.
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Paid order
        "400":
          description: Order cannot be paid

  /api/payments:
    get:
      tags: [Payments]
      summary: List current user's payment orders
      description: Returns payment_order rows including payNo, payScene, channel, amount, pointAmount, status, thirdTradeNo, callbackTime, and idempotencyKey.
      responses:
        "200":
          description: Payment order list

  /api/orders/{orderId}/payments:
    post:
      tags: [Payments]
      summary: Create a pending payment order for a cash order
      description: Creates a pending payment_order without completing payment. goods_cash is used for cash orders, cash_diff is used for points_plus_cash orders. Idempotent by idempotencyKey or default payment:goods:{orderId}.
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                channel:
                  type: string
                  enum: [mock_pay, wechat, alipay]
                  default: mock_pay
                idempotencyKey:
                  type: string
      responses:
        "201":
          description: Pending payment_order
        "400":
          description: Order cannot create payment
        "404":
          description: Order not found

  /api/payments/{payNo}/mock-callback:
    post:
      tags: [Payments]
      summary: Mock payment channel callback
      description: Handles paid or failed callbacks idempotently by payNo. Successful goods callbacks pay the order; successful member_open callbacks extend membership; successful cash_diff callbacks also deduct points once. Failed callbacks create payment_callback_failed exception compensation records.
      parameters:
        - name: payNo
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [paid, failed]
                  default: paid
                thirdTradeNo:
                  type: string
      responses:
        "200":
          description: Callback handled
        "400":
          description: Payment state cannot accept callback
        "404":
          description: Payment order not found

  /api/payments/{payNo}/lfwin:
    post:
      tags: [Payments]
      summary: Initiate an LFWin payment for a pending payment order
      description: Uses server-side LFWIN_* configuration only. Returns a QR code or payment URL and does not mark the order as paid.
      parameters:
        - name: payNo
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                method:
                  type: string
                  enum: [qrcode, h5, wechat_mini, alipay_mini]
                  default: qrcode
                appId:
                  type: string
                openId:
                  type: string
                buyerId:
                  type: string
      responses:
        "200":
          description: Provider payment details
        "400":
          description: Payment is not pending or provider configuration is invalid
        "502":
          description: Provider request failed

  /api/payments/{payNo}/lfwin/query:
    post:
      tags: [Payments]
      summary: Query an LFWin payment and settle a verified successful payment
      parameters:
        - name: payNo
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Provider payment status

  /api/payments/{payNo}/lfwin/close:
    post:
      tags: [Payments]
      summary: Close a pending LFWin payment at the provider
      parameters:
        - name: payNo
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Provider close result

  /api/payment-providers/lfwin/notify:
    post:
      tags: [Payments]
      summary: LFWin payment notification callback
      description: Public form callback. Signature and paid amount are verified before the related payment order is settled. Reply is plain text success only after durable processing.
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [orderid, mch_orderid, paystatus, paymoney, sign]
              properties:
                orderid:
                  type: string
                mch_orderid:
                  type: string
                trade_no:
                  type: string
                paystatus:
                  type: string
                paymoney:
                  type: string
                sign:
                  type: string
      responses:
        "200":
          description: success
        "400":
          description: Invalid signature, amount, or payment state

  /api/orders/{orderId}/refunds:
    post:
      tags: [Orders]
      summary: Request refund for current user's order
      description: Idempotent by active refund request for the same order.
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        "201":
          description: Refund request created
        "400":
          description: Order cannot be refunded
        "403":
          description: Cannot refund another user's order

  /api/tasks:
    get:
      tags: [Tasks]
      summary: List tasks with reward hidden
      description: Proxies bounty-platform task_list when TGG_TASK_PLATFORM_* env vars are configured; otherwise uses local mock tasks.
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: c_id
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: count
          schema:
            type: integer
      responses:
        "200":
          description: Task list without rewardPoints

  /api/task-types:
    get:
      tags: [Tasks]
      summary: List bounty task categories
      description: Proxies index/index/task_type when platform credentials are configured.
      responses:
        "200":
          description: Task category list

  /api/task-platform/status:
    get:
      tags: [Tasks]
      summary: Show task platform proxy mode and mapped upstream endpoints
      responses:
        "200":
          description: Task platform status

  /api/tasks/{taskId}:
    get:
      tags: [Tasks]
      summary: Get task detail with reward
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Task detail
        "404":
          description: Task not found

  /api/tasks/{taskId}/submit:
    post:
      tags: [Tasks]
      summary: Submit task proof
      description: Requires monthly membership. Validates the task's required text fields before storing a local submission intent and calling index/index/task_register. An optional idempotencyKey (nonempty string, maximum 128 characters) must be reused with unchanged content on retry. Uncertain provider results retain the intent and must not trigger a new registration.
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "201":
          description: Submission created
        "400":
          description: Missing required task fields or invalid payload; no new submission is registered
        "403":
          description: Non-member cannot submit bounty tasks
        "404":
          description: Task not found
        "409":
          description: Existing intent has different content or its submission result is still uncertain
        "502":
          description: Provider submission result uncertain; inspect records and retry only with the same key and content
        "503":
          description: Unsupported required task field configuration or invalid reward; no new submission is registered

  /api/submissions:
    get:
      tags: [Tasks]
      summary: List current user task submissions
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [All, reviewing, approved, rejected, "0", "1", "2"]
            default: All
          description: Filter before pagination. Numeric aliases match platform review states.
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
          description: Local results use 10 rows per page; remote page size is controlled by the platform. Continue until an empty page. Without page, local results retain the legacy unpaginated response.
      responses:
        "200":
          description: Submission list
        "400":
          description: Invalid page or review status

  /api/submissions/{submissionId}:
    get:
      tags: [Tasks]
      summary: Get current user's submission detail
      parameters:
        - name: submissionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Submission detail
        "404":
          description: Submission not found

  /api/submissions/{submissionId}/sync:
    post:
      tags: [Tasks]
      summary: Reconcile the current user's local submission with platform review results
      description: Queries the authenticated platform examine list, matching user and task. Missing external IDs require unique payload and creation-time matching in both directions. Scans at most 20 pages and refuses an incomplete or ambiguous match. Confirmed approval uses the original reward snapshot and existing callback ledger idempotency; client-supplied status or reward is never used.
      parameters:
        - name: submissionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current submission after reconciliation, with rewards applied once for confirmed approval
        "401":
          description: Login required
        "404":
          description: No local submission belonging to this user
        "409":
          description: Missing or ambiguous match, incomplete scan, or conflicting review outcome
        "502":
          description: Invalid provider response or unknown review status
        "503":
          description: Task platform not configured

  /api/task/callback:
    post:
      tags: [Tasks]
      summary: Receive bounty platform review callback
      description: Status `1` or `approved` approves and grants task points; invited users also trigger inviter commission by `inviteCommissionRate`. Status `2` or `rejected` rejects. Repeated callbacks are idempotent via `task_callback:{submissionId}:{status}` and `task_callback:{submissionId}:invite_commission`. Successful provider responses are intentionally limited to `{"status":"success"}`; submission and reward details remain in local audit records.
      security: []
      parameters:
        - in: header
          name: x-task-callback-token
          required: false
          schema:
            type: string
          description: Must match server TGG_TASK_CALLBACK_TOKEN. A token query parameter is accepted when the provider cannot set headers. User Bearer authentication is not sufficient.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, sf_uid, status, remarks]
              properties:
                id:
                  type: string
                  description: Submission id or external task order id mapped to submission id in development mode.
                submissionId:
                  type: string
                status:
                  oneOf:
                    - type: integer
                    - type: string
                remarks:
                  type: string
                sf_uid:
                  type: string
      responses:
        "200":
          description: Callback handled; exact response required by provider document
          content:
            application/json:
              schema:
                type: object
                required: [status]
                additionalProperties: false
                properties:
                  status:
                    type: string
                    enum: [success]
        "400":
          description: Invalid callback payload
        "404":
          description: Submission not found and exception created
        "401":
          description: Invalid callback credential
        "409":
          description: Ambiguous external order mapping or conflicting settled status
        "503":
          description: Callback credential has not been configured

  /api/invite/info:
    get:
      tags: [Growth]
      summary: Get invite reward configuration
      responses:
        "200":
          description: Invite info
    post:
      tags: [Growth]
      summary: Get invite reward configuration
      responses:
        "200":
          description: Invite info

  /api/invite/list:
    get:
      tags: [Growth]
      summary: List invited users
      description: Without pagination returns the legacy array. With page or count returns rows, total, page, count; filters to this inviter before ordering by boundAt and invitee ID descending. Contribution totals remain attributed to the invitee's submissions.
      parameters: &invitePagination
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000000, default: 1 }
        - name: count
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Invite array or paginated object containing rows, total, page, count
        "400":
          description: Invalid pagination
    post:
      tags: [Growth]
      summary: List invited users
      description: Same response as GET; pagination parameters are read from the query string.
      parameters: *invitePagination
      responses:
        "200":
          description: Invite array or paginated object containing rows, total, page, count
        "400":
          description: Invalid pagination

  /api/invite/stats:
    get:
      tags: [Growth]
      summary: Get invite statistics
      responses:
        "200":
          description: Invite stats
    post:
      tags: [Growth]
      summary: Get invite statistics
      responses:
        "200":
          description: Invite stats

  /api/signin/status:
    get:
      tags: [Growth]
      summary: Get current sign-in ad progress and streak
      description: Includes sessionId, completionToken, prize, adRewardsAvailable, unavailableReason, totalAds, completedAds, signedToday, lotteryTicket, lotteryUsed and streak reward values. Production adRewardsAvailable is false until server verification exists. The client nonce is not proof of playback.
      responses:
        "200":
          description: Sign-in status
    post:
      tags: [Growth]
      summary: Get current sign-in ad progress and streak
      responses:
        "200":
          description: Sign-in status

  /api/signin/start:
    post:
      tags: [Growth]
      summary: Start sign-in ad session
      responses:
        "200":
          description: Sign-in session

  /api/signin/ad_complete:
    post:
      tags: [Growth]
      summary: Report one completed ad in a development sign-in session
      description: Ad types alternate reward_video and interstitial. Production returns 503 until trusted provider verification is implemented. Refresh status after an uncertain response to recover the next nonce.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, adType, completionToken]
              properties:
                sessionId:
                  type: string
                adType:
                  type: string
                  enum: [reward_video, interstitial]
                completionToken:
                  type: string
                  description: One-time nonce from the latest session status or completion response.
      responses:
        "200":
          description: Ad completion result
        "400":
          description: Wrong ad order or stale completion token
        "404":
          description: No matching session for this user and Shanghai calendar day
        "503":
          description: Production provider verification is unavailable

  /api/signin/lottery_spin:
    post:
      tags: [Growth]
      summary: Spin lottery after sign-in ads
      description: Repeated successful calls return the saved prize without consuming another ticket or crediting again. Invalid prize configuration does not consume the ticket.
      responses:
        "200":
          description: Prize result
        "400":
          description: No available ticket
        "503":
          description: Prize configuration or point account cannot be settled

  /api/pickup-sites:
    get:
      tags: [Catalog]
      summary: List enabled pickup sites
      responses:
        "200":
          description: Pickup sites

  /api/delivery/teams:
    get:
      tags: [Catalog]
