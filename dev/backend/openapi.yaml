  /api/admin/refund-returns:
    get:
      tags: [Admin]
      summary: List refund return inspections for inventory staff
      description: Requires stock:write. Includes refundId, orderId, items, ticket status and handling notes.
      security:
        - AdminBearerAuth: []
      responses:
        "200":
          description: Return inspection list
        "403":
