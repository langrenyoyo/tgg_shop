  /api/providers/huifu/withdraw-callback:
    post:
      tags: [Payments]
      summary: Receive trusted Huifu withdrawal status callback
      description: Requires independent HF_CALLBACK_TOKEN in x-huifu-callback-token or query token. User/admin Bearer tokens are not accepted. Only existing withdrawals are updated; terminal provider results settle according to the status mapping with idempotent ledger handling.
      security: []
      parameters:
        - in: header
          name: x-huifu-callback-token
          required: false
          schema: { type: string }
          description: Must match HF_CALLBACK_TOKEN; query token is accepted only for providers unable to set headers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [out_order_no]
              additionalProperties: true
      responses:
        "200": { description: Callback accepted }
        "401": { description: Invalid callback token }
        "404": { description: Withdrawal not found }
        "503": { description: Callback token is not configured }

  /api/admin/withdrawals:
    get:
      tags: [Admin]
      summary: List withdrawal requests for finance review
      security:
        - AdminBearerAuth: []
      responses:
        "200":
          description: Withdrawal requests
        "403":
