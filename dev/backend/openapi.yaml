  /api/points-ledger:
    get:
      tags: [Orders]
      summary: List current user's point ledger
      description: Filters apply before pagination. Without page and count, returns the legacy array. Supplying either enables an object response ordered by createdAt then ID descending. Source links only reference the current user's business records; invite commissions link to the invite page rather than another user's submission.
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000000, default: 1 }
        - name: count
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: type
          in: query
          description: Exact changeType filter; empty means all types.
          schema: { type: string }
        - name: direction
          in: query
          schema: { type: string, enum: ["", in, out] }
      responses:
        "200":
          description: Current user's point ledger, with filtered total and pagination metadata when requested
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: { type: object }
                  - type: object
                    required: [rows, total, page, count]
                    properties:
                      rows:
                        type: array
                        items:
                          type: object
                          properties:
                            source:
                              type: object
                              nullable: true
                              properties:
                                type: { type: string, enum: [order, submission, invite, signin] }
                                id: { type: string }
                      total: { type: integer, minimum: 0 }
                      page: { type: integer, minimum: 1 }
                      count: { type: integer, minimum: 1, maximum: 100 }
        "400":
          description: Invalid pagination or direction

