  /api/admin/refund-returns/{refundId}/resolve:
    post:
      tags: [Admin]
      summary: Confirm final return inspection and inventory disposition
      description: Requires stock:write and a reason. Restock only physically received and accepted quantities. Partial requires exactly one items entry for every original product, with integer restockQuantity between zero and its ordered quantity. Remaining quantities are finalized as no-restock; this is not an incremental receipt. Repeating the same disposition and quantities is idempotent; changing them after completion returns 409.
      security:
        - AdminBearerAuth: []
      parameters:
        - name: refundId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [disposition, reason]
              properties:
                disposition:
                  type: string
                  enum: [restock, no_restock, partial]
                reason:
                  type: string
                  minLength: 1
                items:
                  type: array
                  description: Required when disposition is partial; include every original order product exactly once.
                  minItems: 1
                  items:
                    type: object
                    required: [productId, restockQuantity]
                    properties:
                      productId:
                        type: string
                      restockQuantity:
                        type: integer
                        minimum: 0
      responses:
        "200":
          description: Resolved return ticket; restock writes inventory and audit records
        "400":
          description: Missing disposition or reason
        "403":
          description: Missing stock permission
        "404":
          description: Refund, order or return ticket missing
        "409":
          description: Refund state, inventory data or previous disposition conflicts

